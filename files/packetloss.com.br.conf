# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name packetloss.com.br www.packetloss.com.br;
    return 301 https://$host$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate         /etc/letsencrypt/live/packetloss.com.br/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/packetloss.com.br/privkey.pem;

    server_name www.packetloss.com.br;
    return 301 https://packetloss.com.br$request_uri;
}

# Main application server (Next.js 16.2 App Router)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate         /etc/letsencrypt/live/packetloss.com.br/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/packetloss.com.br/privkey.pem;

    server_name packetloss.com.br;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Clear hop-by-hop headers; Next.js production does not use WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # Required for RSC streaming
        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
